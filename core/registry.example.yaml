# Omni OS base registry: which harness runs which job.
#
# This is the registry a fresh Omni OS checkout runs: the platform and Atma, nothing else. A machine
# keeps its own `core/registry.yaml` (on its instance branch) and core loads that instead when it
# exists. Add a domain's jobs there, never here. Validate with `omni check`.
#
#   harnesses the agent runtimes a job can be bound to
#   domains   where each domain's code lives
#   services  long-running processes launchd keeps alive; `omni status` watches them
#   plans     named groups of jobs in dependency order; `omni plan` and the system page draw them
#   jobs      run-to-completion work; `omni run JOB` dispatches it and records it in the ledger

version: 1

harnesses:
  script:
    kind: script            # plain command, no model
  hermes:
    kind: hermes            # optional: personas and chat through Hermes
    bin: ~/.local/bin/hermes
  opencode:
    kind: opencode          # optional: code changes
    bin: ~/.local/bin/opencode
  pi:
    kind: pi                # optional: headless pipeline jobs; pinned in harnesses/pi (npm ci)
    bin: ~/omni/core/harnesses/pi/node_modules/.bin/pi

domains:
  omni:
    workdir: ~/omni
  atma:
    workdir: ~/omni/atma

services:
  postgres:        {domain: omni, launchd: dev.omni.postgres, port: 5433}   # the run ledger
  omni-dashboard:  {domain: omni, launchd: dev.omni.omni-dashboard, port: 8600}
  atma-dashboard:  {domain: atma, launchd: dev.omni.atma-dashboard, port: 8601}
  atma-api:        {domain: atma, launchd: dev.omni.atma-api, port: 8602}
  atma-mcp:        {domain: atma, launchd: dev.omni.atma-mcp}

plans:
  atma:
    description: Tasks verified and the Atma tree redrawn each night
    stages:
      - name: Verify
        jobs: [atma-auto-verify]
      - name: Grow the tree
        jobs: [omni-mindmap-etl]
        needs: [Verify]

jobs:
  smoke-script:
    domain: omni
    harness: script
    command: [/bin/echo, "omni core ok"]
    timeout_s: 30

  atma-auto-verify:
    domain: atma
    harness: script
    launchd: dev.omni.atma-auto-verify
    schedule: "02:30"
    command: ["/usr/bin/env", "-u", "PYTHONPATH", "~/omni/atma/api/.venv/bin/python", "scripts/auto_verify.py"]
    workdir: "~/omni/atma/api"
    timeout_s: 3600

  omni-mindmap-etl:
    domain: omni
    harness: script
    launchd: dev.omni.omni-mindmap-etl
    schedule: "02:45"
    command: ["~/omni/.venv/bin/python", "~/omni/mindmap.py"]
    workdir: "~/omni"
    timeout_s: 3600
