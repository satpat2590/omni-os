[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "omnikit"
version = "0.1.0"
description = "Code shared across Omni OS domains (Jev client first)"
requires-python = ">=3.10"
dependencies = []  # no hard deps: requests is used when present

[tool.setuptools.packages.find]
where = ["src"]
